name: Build Cinejoy Native iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          cat > project.yml <<'EOF'
          name: CinejoyNative

          options:
            bundleIdPrefix: com.cinejoy

          targets:
            CinejoyNative:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: CinejoyNative
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.cinejoy.native
                  INFOPLIST_KEY_CFBundleDisplayName: Cinejoy
                  SWIFT_VERSION: "5.0"
          EOF

          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project CinejoyNative.xcodeproj \
            -scheme CinejoyNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/output" \
            2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          echo "===== XCODE ERRORS ====="
          grep -n -E "error:|BUILD FAILED|SwiftCompile" build.log || true
          echo "===== END ERRORS ====="

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R output/CinejoyNative.app Payload/
          zip -r CinejoyNative.ipa Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CinejoyNative-IPA
          path: CinejoyNative.ipa
