name: Build Cinejoy Native iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Xcode project
        run: |
          cat > project.yml <<'EOF'
          name: CinejoyNative

          options:
            bundleIdPrefix: com.cinejoy

          targets:
            CinejoyNative:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - CinejoyNative
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.cinejoy.native
                  INFOPLIST_KEY_CFBundleDisplayName: Cinejoy
                  SWIFT_VERSION: 5.0
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project CinejoyNative.xcodeproj \
            -scheme CinejoyNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/output"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R output/CinejoyNative.app Payload/
          zip -r CinejoyNative.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CinejoyNative-IPA
          path: CinejoyNative.ipa
